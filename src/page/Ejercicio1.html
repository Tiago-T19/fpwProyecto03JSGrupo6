<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
    <link rel="stylesheet" href="../css/styles1.css">
</head>
<body>

    <h2>Registro de Estudiantes</h2>

    <form id="formEstudiante">
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" class="input-campo" id="nombre" placeholder="Ej: María" required>
        </div>
        
        <div>
            <label for="apellido">Apellido:</label>
            <input type="text" class="input-campo" id="apellido" placeholder="Ej: Diaz" required>
        </div>
        
        <div>
            <label for="libreta">Libreta Universitaria:</label>
            <input type="text" class="input-campo" id="libreta" placeholder="Ej: APU999999" required>
        </div>

        <button type="button" id="btnAgregar">Agregar a la Tabla</button>
    </form>

    <h3>Lista de Estudiantes</h3>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Libreta Universitaria</th>
            </tr>
        </thead>
        <tbody id="tablaCuerpo">
        </tbody>
    </table>

    <script type="module" src="../js/ejercicio1.js"></script>
</body>
</html>
